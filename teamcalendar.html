<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>팀 스케줄 달력</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="module-shim" src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f5; }
button, input { font-family: inherit; }
.cell {
  border-right: 1px solid #e5e5e5;
  border-bottom: 1px solid #e5e5e5;
  padding: 6px 6px 8px;
  min-height: 120px;
  display: flex;
  flex-direction: column;
  gap: 3px;
  background: #fff;
  cursor: pointer;
  user-select: none;
  transition: background 0.1s;
}
.cell:hover { background: #f5f5f5; }
.cell.today { background: #EBF4FD; }
.cell.today:hover { background: #DCE9F7; }
.cell.empty { background: #f9f9f9; cursor: default; pointer-events: none; }
.cell.selected { background: #EEF2FF !important; outline: 2px solid #6366F1; outline-offset: -2px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">

const STATUSES = [
  { key: "재택",      icon: "🏠", label: "재택" },
  { key: "오전반차",   icon: "🌤", label: "오전반차" },
  { key: "오후반차",   icon: "🌥", label: "오후반차" },
  { key: "오전반반차", icon: "🌅", label: "오전반반차" },
  { key: "오후반반차", icon: "🌇", label: "오후반반차" },
  { key: "연차",      icon: "🌴", label: "연차" },
];

const MEMBER_COLORS = [
  { bg: "#DDD6FE", text: "#4C1D95", dot: "#7C3AED" },
  { bg: "#BBF7D0", text: "#14532D", dot: "#16A34A" },
  { bg: "#FECACA", text: "#7F1D1D", dot: "#DC2626" },
  { bg: "#FED7AA", text: "#7C2D12", dot: "#EA580C" },
  { bg: "#BAE6FD", text: "#0C4A6E", dot: "#0284C7" },
  { bg: "#FDE68A", text: "#78350F", dot: "#D97706" },
  { bg: "#FBCFE8", text: "#831843", dot: "#DB2777" },
  { bg: "#A7F3D0", text: "#064E3B", dot: "#059669" },
];

// Firebase config
const firebaseConfig = {
  apiKey: "AIzaSyCF6AutNSMRZ2uz3ycebjXOEnx7OL_arh4",
  authDomain: "team-calendar-afba4.firebaseapp.com",
  databaseURL: "https://team-calendar-afba4-default-rtdb.firebaseio.com",
  projectId: "team-calendar-afba4",
  storageBucket: "team-calendar-afba4.firebasestorage.app",
  messagingSenderId: "19731911902",
  appId: "1:19731911902:web:d793ee1006614213195e4f"
};

// Firebase 초기화 (CDN compat 버전 사용)
let db = null;
let firebaseRef = null;

function App() {
  const now = new Date();
  const [year, setYear] = React.useState(now.getFullYear());
  const [month, setMonth] = React.useState(now.getMonth());
  const [members, setMembers] = React.useState(["허원","박세희","김도연"]);
  const [records, setRecords] = React.useState({});
  const [newName, setNewName] = React.useState("");
  const [selected, setSelected] = React.useState([]);
  const [modal, setModal] = React.useState(false);
  const [modalState, setModalState] = React.useState({});
  const [deletedMembers, setDeletedMembers] = React.useState(new Set());
  const [loaded, setLoaded] = React.useState(false);

  // Firebase 연동
  React.useEffect(() => {
    const script1 = document.createElement("script");
    script1.src = "https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js";
    script1.onload = () => {
      const script2 = document.createElement("script");
      script2.src = "https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js";
      script2.onload = () => {
        if (!window.firebase.apps.length) {
          window.firebase.initializeApp(firebaseConfig);
        }
        db = window.firebase.database();
        // 실시간으로 데이터 수신
        db.ref("/").on("value", snap => {
          const val = snap.val() || {};
          setMembers(val.members || ["허원","박세희","김도연"]);
          setRecords(val.records || {});
          setLoaded(true);
        });
      };
      document.head.appendChild(script2);
    };
    document.head.appendChild(script1);
    return () => { if (db) db.ref("/").off(); };
  }, []);

  const save = (newMembers, newRecords) => {
    if (!db) return;
    db.ref("/").set({ members: newMembers, records: newRecords });
  };

  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const firstDay = new Date(year, month, 1).getDay();
  const weeks = ["일","월","화","수","목","금","토"];
  const monthNames = ["1월","2월","3월","4월","5월","6월","7월","8월","9월","10월","11월","12월"];
  const dk = (d) => `${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;

  const toggleSelect = (d) => setSelected(s => s.includes(d) ? s.filter(x=>x!==d) : [...s, d]);
  const clearSelection = () => { setSelected([]); setModal(false); setModalState({}); setDeletedMembers(new Set()); };

  const openModal = () => {
    const init = {};
    members.forEach(m => {
      const allSets = selected.map(d => {
        const sts = (records[dk(d)] || {})[m];
        if (!sts) return new Set();
        return new Set(Array.isArray(sts) ? sts : [sts]);
      });
      if (allSets.length === 0) { init[m] = new Set(); return; }
      const common = new Set([...allSets[0]].filter(s => allSets.every(set => set.has(s))));
      init[m] = common;
    });
    setModalState(init);
    setDeletedMembers(new Set());
    setModal(true);
  };

  const toggleModalStatus = (member, key) => {
    setDeletedMembers(dm => { const n = new Set(dm); n.delete(member); return n; });
    setModalState(ms => {
      const prev = new Set(ms[member] || []);
      if (prev.has(key)) prev.delete(key); else prev.add(key);
      return {...ms, [member]: prev};
    });
  };

  const toggleDelete = (member) => {
    setDeletedMembers(dm => {
      const n = new Set(dm);
      if (n.has(member)) { n.delete(member); }
      else { n.add(member); setModalState(ms => ({...ms, [member]: new Set()})); }
      return n;
    });
  };

  const applyModal = () => {
    const newRecords = {...records};
    selected.forEach(d => {
      const k = dk(d);
      const prev = newRecords[k] ? {...newRecords[k]} : {};
      members.forEach(m => {
        if (deletedMembers.has(m)) { delete prev[m]; }
        else {
          const chosen = modalState[m];
          if (chosen && chosen.size > 0) prev[m] = Array.from(chosen);
          else delete prev[m];
        }
      });
      newRecords[k] = prev;
    });
    save(members, newRecords);
    clearSelection();
  };

  const addMember = () => {
    const n = newName.trim();
    if (n && !members.includes(n)) {
      const newMembers = [...members, n];
      save(newMembers, records);
    }
    setNewName("");
  };

  const removeMember = (m) => {
    const newMembers = members.filter(x => x !== m);
    save(newMembers, records);
  };

  const prevMonth = () => { if (month===0){setYear(y=>y-1);setMonth(11);}else setMonth(m=>m-1); };
  const nextMonth = () => { if (month===11){setYear(y=>y+1);setMonth(0);}else setMonth(m=>m+1); };
  const totalCells = firstDay + daysInMonth;
  const trailingCells = (7 - (totalCells % 7)) % 7;

  if (!loaded) return (
    <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",fontSize:15,color:"#888"}}>
      🔄 데이터 불러오는 중...
    </div>
  );

  return (
    <div style={{padding:"1rem",maxWidth:1050,margin:"0 auto"}}>
      <h2 style={{fontSize:18,fontWeight:500,margin:"0 0 1rem",color:"#111"}}>팀 스케줄 달력</h2>

      {/* 팀원 목록 */}
      <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:16,alignItems:"center"}}>
        {members.map((m,i) => {
          const c = MEMBER_COLORS[i%MEMBER_COLORS.length];
          return (
            <div key={m} style={{display:"flex",alignItems:"center",gap:5,padding:"4px 10px",borderRadius:20,background:c.bg,border:`1px solid ${c.dot}44`}}>
              <span style={{fontSize:13,color:c.text,fontWeight:500}}>{m}</span>
              <span onClick={()=>removeMember(m)} style={{fontSize:11,color:c.text,opacity:0.6,cursor:"pointer"}}>✕</span>
            </div>
          );
        })}
        <div style={{display:"flex",gap:6,alignItems:"center"}}>
          <input value={newName} onChange={e=>setNewName(e.target.value)} onKeyUp={e=>e.key==="Enter"&&addMember()}
            placeholder="이름 추가" style={{width:80,fontSize:13,padding:"4px 8px",borderRadius:8,border:"1px solid #ddd",outline:"none"}}/>
          <button onClick={addMember} style={{padding:"4px 10px",borderRadius:8,fontSize:13,border:"1px solid #ddd",cursor:"pointer",background:"#fff"}}>+</button>
        </div>
      </div>

      {/* 달력 헤더 */}
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:10}}>
        <button onClick={prevMonth} style={{padding:"4px 10px",borderRadius:8,border:"1px solid #ddd",cursor:"pointer",fontSize:14,background:"#fff"}}>‹</button>
        <span style={{fontSize:16,fontWeight:500,minWidth:90,textAlign:"center",color:"#111"}}>{year}년 {monthNames[month]}</span>
        <button onClick={nextMonth} style={{padding:"4px 10px",borderRadius:8,border:"1px solid #ddd",cursor:"pointer",fontSize:14,background:"#fff"}}>›</button>
        <button onClick={()=>{setYear(now.getFullYear());setMonth(now.getMonth());}}
          style={{marginLeft:"auto",padding:"4px 14px",borderRadius:8,border:"1px solid #378ADD",cursor:"pointer",fontSize:13,background:"#fff",color:"#378ADD",fontWeight:500}}>
          Today
        </button>
      </div>

      {/* 선택 바 */}
      {selected.length > 0 ? (
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10,padding:"8px 14px",borderRadius:10,background:"#EEF2FF",border:"1px solid #6366F1"}}>
          <span style={{fontSize:13,color:"#4338CA",fontWeight:500}}>
            {[...selected].sort((a,b)=>a-b).join(", ")}일 선택 ({selected.length}개)
          </span>
          <button onClick={openModal}
            style={{marginLeft:"auto",padding:"4px 14px",borderRadius:8,fontSize:13,background:"#6366F1",color:"#fff",border:"none",cursor:"pointer",fontWeight:500}}>
            적용하기
          </button>
          <button onClick={clearSelection}
            style={{padding:"4px 10px",borderRadius:8,fontSize:13,background:"transparent",color:"#6366F1",border:"1px solid #6366F1",cursor:"pointer"}}>
            취소
          </button>
        </div>
      ) : (
        <div style={{fontSize:12,color:"#bbb",marginBottom:10}}>날짜를 클릭해서 선택 후 적용하기를 눌러주세요</div>
      )}

      {/* 달력 */}
      <div style={{borderTop:"1px solid #e5e5e5",borderLeft:"1px solid #e5e5e5",borderRadius:12,overflow:"hidden",background:"#fff"}}>
        <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",background:"#f9f9f9"}}>
          {weeks.map((w,i)=>(
            <div key={w} style={{textAlign:"center",padding:"8px 0",fontSize:12,fontWeight:500,
              color:i===0?"#c0392b":i===6?"#2980b9":"#666",
              borderRight:"1px solid #e5e5e5",borderBottom:"1px solid #e5e5e5"}}>
              {w}
            </div>
          ))}
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)"}}>
          {Array(firstDay).fill(null).map((_,i)=>(
            <div key={"e"+i} className="cell empty"/>
          ))}
          {Array(daysInMonth).fill(null).map((_,i)=>{
            const d = i+1;
            const k = dk(d);
            const rec = records[k] || {};
            const dow = (firstDay+i)%7;
            const isToday = d===now.getDate()&&month===now.getMonth()&&year===now.getFullYear();
            const isSel = selected.includes(d);
            return (
              <div key={d} className={`cell${isToday&&!isSel?" today":""}${isSel?" selected":""}`}
                onClick={()=>toggleSelect(d)}>
                <div style={{fontSize:12,color:dow===0?"#c0392b":dow===6?"#2980b9":isSel?"#4338CA":"#222",marginBottom:2,display:"flex",justifyContent:"flex-end",alignItems:"center",minHeight:20}}>
                  {isToday
                    ? <span style={{width:20,height:20,borderRadius:"50%",background:isSel?"#6366F1":"#378ADD",color:"#fff",fontSize:11,display:"inline-flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{d}</span>
                    : <span style={{lineHeight:"20px"}}>{d}</span>}
                </div>
                {members.map((m,mi)=>{
                  const sts = rec[m];
                  if (!sts || sts.length === 0) return null;
                  const c = MEMBER_COLORS[mi%MEMBER_COLORS.length];
                  const stList = Array.isArray(sts) ? sts : [sts];
                  const icons = stList.map(s => STATUSES.find(x=>x.key===s)?.icon||"").join("");
                  const tooltip = stList.map(s => STATUSES.find(x=>x.key===s)?.label||s).join(" · ");
                  return (
                    <div key={m} style={{display:"flex",alignItems:"center",gap:3,padding:"2px 6px",borderRadius:5,background:c.bg,flexShrink:0}}>
                      <span style={{fontSize:11,flexShrink:0}}>{icons}</span>
                      <span style={{fontSize:11,fontWeight:500,color:c.text,whiteSpace:"nowrap"}}>{m} {tooltip}</span>
                    </div>
                  );
                })}
              </div>
            );
          })}
          {Array(trailingCells).fill(null).map((_,i)=>(
            <div key={"t"+i} className="cell empty"/>
          ))}
        </div>
      </div>

      {/* 적용 모달 */}
      {modal && (
        <div onClick={()=>setModal(false)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.4)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:100}}>
          <div onClick={e=>e.stopPropagation()} style={{background:"#fff",borderRadius:16,padding:"1.25rem 1.5rem",width:340,boxShadow:"0 8px 32px rgba(0,0,0,0.18)",maxHeight:"85vh",overflowY:"auto"}}>
            <div style={{fontSize:16,fontWeight:500,marginBottom:4,color:"#111"}}>날짜 적용</div>
            <div style={{fontSize:12,color:"#888",marginBottom:16}}>{[...selected].sort((a,b)=>a-b).join(", ")}일 ({selected.length}개)</div>
            {members.map((m,i)=>{
              const c = MEMBER_COLORS[i%MEMBER_COLORS.length];
              const chosen = modalState[m] || new Set();
              const isDeleted = deletedMembers.has(m);
              return (
                <div key={m} style={{marginBottom:16,padding:"10px 12px",borderRadius:10,border:`1.5px solid ${isDeleted?"#EF4444":c.dot}33`,background:isDeleted?"#FFF5F5":"#fafafa"}}>
                  <div style={{fontSize:13,fontWeight:500,marginBottom:8,display:"flex",alignItems:"center",gap:7,color:"#111"}}>
                    <span style={{width:10,height:10,borderRadius:"50%",background:c.dot,display:"inline-block",flexShrink:0}}/>
                    {m}
                  </div>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
                    {STATUSES.map(st=>{
                      const on = !isDeleted && chosen.has(st.key);
                      return (
                        <button key={st.key} onClick={()=>toggleModalStatus(m,st.key)}
                          style={{padding:"8px 0",borderRadius:8,fontSize:12,
                            border:`2px solid ${on?c.dot:"#e5e5e5"}`,
                            background:on?c.bg:"#fff",
                            color:on?c.text:"#999",
                            cursor:"pointer",fontWeight:on?600:400,
                            opacity:isDeleted?0.35:1,
                            transition:"all 0.1s"}}>
                          {st.icon} {st.label}
                        </button>
                      );
                    })}
                    <button onClick={()=>toggleDelete(m)}
                      style={{padding:"8px 0",borderRadius:8,fontSize:12,gridColumn:"1/-1",
                        border:`2px solid ${isDeleted?"#EF4444":"#e5e5e5"}`,
                        background:isDeleted?"#FEE2E2":"#fff",
                        color:isDeleted?"#B91C1C":"#bbb",
                        cursor:"pointer",fontWeight:isDeleted?600:400,
                        transition:"all 0.1s"}}>
                      ✕ {m} 기록 삭제{isDeleted?" ✓":""}
                    </button>
                  </div>
                </div>
              );
            })}
            <button onClick={applyModal}
              style={{width:"100%",marginTop:4,padding:"10px 0",borderRadius:10,border:"none",background:"#6366F1",color:"#fff",cursor:"pointer",fontSize:14,fontWeight:500}}>
              적용하기
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
