<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>면접 캘린더 생성기</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Nanum+Gothic:wght@400;700&display=swap');

  :root {
    --bg: #faf8f5;
    --surface: #ffffff;
    --surface2: #f5f3f0;
    --border: #e8e4df;
    --accent: #ff6b35;
    --accent2: #ff8c5a;
    --text: #2d2a26;
    --text2: #7a7570;
    --text3: #b5b0aa;
    --radius: 16px;
    --success: #27ae60;
    --shadow: 0 2px 12px rgba(0,0,0,0.06);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', 'Nanum Gothic', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 40px 20px;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
  }

  header {
    margin-bottom: 32px;
    text-align: center;
  }

  header .emoji {
    font-size: 40px;
    margin-bottom: 12px;
    display: block;
  }

  header h1 {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: var(--text);
  }

  header p {
    font-size: 14px;
    color: var(--text2);
    margin-top: 6px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }

  .card-title {
    font-size: 12px;
    font-weight: 800;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 1.2px;
    margin-bottom: 16px;
  }

  .field { margin-bottom: 14px; }

  label {
    display: block;
    font-size: 12px;
    color: var(--text2);
    margin-bottom: 6px;
    font-weight: 700;
  }

  input, select, textarea {
    width: 100%;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    padding: 10px 14px;
    outline: none;
    transition: border-color 0.2s;
  }

  input:focus, select:focus, textarea:focus {
    border-color: var(--accent);
    background: #fff;
  }

  textarea {
    resize: vertical;
    min-height: 90px;
    line-height: 1.7;
  }

  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .round-block {
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 12px;
    position: relative;
    transition: border-color 0.2s;
  }

  .round-block:hover { border-color: var(--accent2); }

  .round-block .block-label {
    font-size: 12px;
    font-weight: 800;
    color: var(--accent);
    margin-bottom: 12px;
  }

  .remove-btn {
    position: absolute;
    top: 16px;
    right: 16px;
    background: none;
    border: none;
    color: var(--text3);
    cursor: pointer;
    font-size: 18px;
    padding: 0;
    line-height: 1;
    transition: color 0.2s;
  }

  .remove-btn:hover { color: #e74c3c; }

  .add-btn {
    width: 100%;
    background: none;
    border: 2px dashed var(--border);
    border-radius: 10px;
    color: var(--text2);
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    padding: 12px;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 4px;
  }

  .add-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: #fff8f5;
  }

  .generate-btn {
    width: 100%;
    background: var(--accent);
    border: none;
    border-radius: 12px;
    color: white;
    font-family: inherit;
    font-size: 15px;
    font-weight: 800;
    padding: 16px;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 8px;
    box-shadow: 0 4px 14px rgba(255,107,53,0.3);
  }

  .generate-btn:hover {
    background: var(--accent2);
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(255,107,53,0.35);
  }

  .output-area {
    display: none;
    margin-top: 20px;
  }

  .output-area.visible { display: block; }

  .output-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .output-header span {
    font-size: 12px;
    font-weight: 800;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .copy-btn {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    padding: 8px 16px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .copy-btn:hover { border-color: var(--accent); color: var(--accent); }
  .copy-btn.copied { border-color: var(--success); color: var(--success); }

  .output-text {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 22px;
    font-size: 13px;
    line-height: 1.9;
    white-space: pre-wrap;
    color: var(--text);
    font-family: 'Nanum Gothic', sans-serif;
    box-shadow: var(--shadow);
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <span class="emoji">📅</span>
    <h1>면접 캘린더 설명 생성기</h1>
    <p>차수별 정보를 입력하면 캘린더 설명란에 바로 붙여넣을 수 있는 텍스트를 만들어드려요</p>
  </header>

  <div class="card">
    <div class="card-title">📌 기본 정보</div>
    <div class="row">
      <div class="field">
        <label>면접 유형</label>
        <select id="roundType" onchange="updateLabels()">
          <option value="1">1차 면접</option>
          <option value="2" selected>2차 면접</option>
          <option value="3">3차 면접</option>
        </select>
      </div>
      <div class="field">
        <label>후보자 이름</label>
        <input type="text" id="candidate" placeholder="예: 홍길동">
      </div>
    </div>
    <div class="field">
      <label>킥오프 문서 링크</label>
      <input type="text" id="kickoff" placeholder="https://docs.google.com/...">
    </div>
  </div>

  <div class="card">
    <div class="card-title">👤 차수별 면접관 정보</div>
    <div id="rounds"></div>
    <button class="add-btn" onclick="addRound()">+ 차수 추가</button>
  </div>

  <button class="generate-btn" onclick="generate()">📋 캘린더 텍스트 생성하기</button>

  <div class="output-area" id="outputArea">
    <div class="output-header">
      <span>✨ 생성된 텍스트</span>
      <button class="copy-btn" id="copyBtn" onclick="copyText()">
        <span>📋</span> 복사하기
      </button>
    </div>
    <div class="output-text" id="outputText"></div>
  </div>
</div>

<script>
  const MUSINSA_WAY_LINK = 'https://wiki.team.musinsa.com/wiki/spaces/MW/pages/50745579/MUSINSA+WAY+Interview+Deck';

  function formatTime(input) {
    if (!input) return '';
    // 이미 콜론 포함된 경우 (예: 14:30) 그대로
    if (input.includes(':')) return input;
    // 숫자만 입력한 경우 (예: 14 → 14:00, 1430 → 14:30)
    if (/^\d{1,2}$/.test(input)) return `${input}:00`;
    if (/^\d{3,4}$/.test(input)) {
      const h = input.slice(0, -2);
      const m = input.slice(-2);
      return `${h}:${m}`;
    }
    return input;
  }
  let roundCount = 0;
  let roundIds = [];

  function addRound() {
    roundCount++;
    const id = roundCount;
    roundIds.push(id);

    const div = document.createElement('div');
    div.className = 'round-block';
    div.id = `round-${id}`;
    div.innerHTML = `
      <div class="block-label" id="label-${id}"></div>
      <button class="remove-btn" onclick="removeRound(${id})">✕</button>
      <div class="row">
        <div class="field">
          <label>면접관 이름</label>
          <input type="text" id="iname-${id}" placeholder="예: 유영구">
        </div>
        <div class="field">
          <label>면접 시작 시간</label>
          <input type="text" id="itime-${id}" placeholder="예: 14 또는 1430">
        </div>
      </div>
      <div class="field">
        <label>검증 역량 (역량명: 내용 형식으로 입력, 줄바꿈으로 구분)</label>
        <textarea id="icomp-${id}" placeholder="경계를 넘는 협업: 다부서가 관여하는 프로젝트를 리딩하며...&#10;오너십: 본인이 주도적으로 방향을 제안하고..."></textarea>
      </div>
    `;
    document.getElementById('rounds').appendChild(div);
    updateLabels();
  }

  function removeRound(id) {
    const el = document.getElementById(`round-${id}`);
    if (el) el.remove();
    roundIds = roundIds.filter(r => r !== id);
    updateLabels();
  }

  function updateLabels() {
    const roundType = document.getElementById('roundType').value;
    const activeIds = roundIds.filter(id => document.getElementById(`round-${id}`));
    activeIds.forEach((id, i) => {
      const label = document.getElementById(`label-${id}`);
      if (label) label.textContent = `${roundType}-${i + 1}차 면접관`;
    });
  }

  function generate() {
    const roundType = document.getElementById('roundType').value;
    const kickoff = document.getElementById('kickoff').value.trim();
    const activeIds = roundIds.filter(id => document.getElementById(`round-${id}`));

    if (activeIds.length === 0) {
      alert('차수를 최소 1개 추가해주세요!');
      return;
    }

    // HTML 버전 (복사용)
    let html = '';
    html += `<b>[검증 영역]</b>`;
    html += `<ul>`;

    activeIds.forEach((id, i) => {
      const name = document.getElementById(`iname-${id}`).value.trim();
      const rawTime = document.getElementById(`itime-${id}`).value.trim();
      const time = formatTime(rawTime);
      const comp = document.getElementById(`icomp-${id}`).value.trim();

      html += `<li style="margin-bottom:10px">${roundType}-${i + 1}차 ${name} 님 (${time})`;

      if (comp) {
        html += `<ul>`;
        comp.split('\n').forEach(line => {
          line = line.trim();
          if (!line) return;
          const colonIdx = line.indexOf(':');
          if (colonIdx > -1) {
            const title = line.substring(0, colonIdx).trim();
            const content = line.substring(colonIdx + 1).trim();
            html += `<li><b>${title}:</b> ${content}</li>`;
          } else {
            html += `<li>${line}</li>`;
          }
        });
        html += `</ul>`;
      }
      html += `</li>${i < activeIds.length - 1 ? '<br>' : ''}`;
    });

    html += `</ul>`;
    html += `<br><b>[참고 사항]</b><br>`;
    html += `• <a href="${MUSINSA_WAY_LINK}">MUSINSA WAY Interview Deck</a><br>`;
    if (kickoff) html += `• <a href="${kickoff}">킥오프 문서</a><br>`;

    // 미리보기용 텍스트
    let preview = '';
    preview += `[검증 영역]\n\n`;

    activeIds.forEach((id, i) => {
      const name = document.getElementById(`iname-${id}`).value.trim();
      const rawTime = document.getElementById(`itime-${id}`).value.trim();
      const time = formatTime(rawTime);
      const comp = document.getElementById(`icomp-${id}`).value.trim();

      preview += `• ${roundType}-${i + 1}차 ${name} 님 (${time})\n`;

      if (comp) {
        comp.split('\n').forEach(line => {
          line = line.trim();
          if (!line) return;
          const colonIdx = line.indexOf(':');
          if (colonIdx > -1) {
            const title = line.substring(0, colonIdx).trim();
            const content = line.substring(colonIdx + 1).trim();
            preview += `   • ${title}: ${content}\n`;
          } else {
            preview += `   • ${line}\n`;
          }
        });
      }
      preview += `\n`;
    });

    preview += `[참고 사항]\n\n`;
    preview += `• MUSINSA WAY Interview Deck (링크 포함)\n`;
    if (kickoff) preview += `• 킥오프 문서 (링크 포함)\n`;

    // 저장
    document.getElementById('outputText').textContent = preview;
    document.getElementById('outputText').setAttribute('data-html', html);
    document.getElementById('outputArea').classList.add('visible');
    document.getElementById('outputArea').scrollIntoView({ behavior: 'smooth' });
  }

  function copyText() {
    const html = document.getElementById('outputText').getAttribute('data-html');
    if (!html) return;

    try {
      const blob = new Blob([html], { type: 'text/html' });
      const item = new ClipboardItem({ 'text/html': blob });
      navigator.clipboard.write([item]).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.classList.add('copied');
        btn.innerHTML = '<span>✅</span> 복사됨!';
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.innerHTML = '<span>📋</span> 복사하기';
        }, 2000);
      });
    } catch (e) {
      // fallback
      navigator.clipboard.writeText(document.getElementById('outputText').textContent);
    }
  }

  addRound();
  addRound();
</script>
</body>
</html>
