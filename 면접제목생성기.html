<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>면접 제목 생성기</title>
    <style>
        body { font-family: 'Pretendard', sans-serif; padding: 20px; background-color: #f5f7fa; display: flex; justify-content: center; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h2 { color: #333; margin-bottom: 20px; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        select, input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        button { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #0056b3; }
        .result-container { margin-top: 25px; padding: 15px; background-color: #e9ecef; border-radius: 8px; display: none; }
        .result-label { font-size: 12px; color: #666; margin-bottom: 5px; }
        .result-text { font-size: 16px; font-weight: bold; color: #333; word-break: break-all; margin-bottom: 10px; }
        .copy-btn { background-color: #28a745; margin-top: 5px; }
        .copy-btn:hover { background-color: #218838; }
    </style>
</head>
<body>

<div class="container">
    <h2>면접 제목 생성기</h2>
    
    <div class="form-group">
        <label>1. 분류</label>
        <select id="t1">
            <option value="Tech">Tech</option>
            <option value="Biz">Biz</option>
            <option value="Global">Global</option>
            <option value="Exec">Exec</option>
        </select>
    </div>

    <div class="form-group">
        <label>2. 인터뷰 유형</label>
        <select id="t2">
            <option value="대면인터뷰">대면인터뷰</option>
            <option value="화상인터뷰">화상인터뷰</option>
            <option value="커피챗">커피챗</option>
            <option value="전화면접">전화면접</option>
        </select>
    </div>

    <div class="form-group">
        <label>3. 단계 (예: 1-2)</label>
        <input type="text" id="step" placeholder="예: 1-2">
    </div>

    <div class="form-group">
        <label>4. 포지션명</label>
        <input type="text" id="position" placeholder="예: Recruiter">
    </div>

    <div class="form-group">
        <label>5. 지원자 성함</label>
        <input type="text" id="candidate" placeholder="성함을 입력하세요">
    </div>

    <div class="form-group">
        <label>6. Greeting URL (필수)</label>
        <input type="text" id="url" placeholder="https://app.greetinghr.com/...">
    </div>

    <button onclick="generateTitle()">제목 생성하기</button>

    <div id="resultContainer" class="result-container">
        <div class="result-label">생성된 제목:</div>
        <div id="resultText" class="result-text"></div>
        <button class="copy-btn" onclick="copyToClipboard()">복사하기</button>
    </div>
</div>

<script>
    function generateTitle() {
        const t1 = document.getElementById('t1').value;
        const t2 = document.getElementById('t2').value;
        const step = document.getElementById('step').value;
        const position = document.getElementById('position').value;
        const candidate = document.getElementById('candidate').value;
        const url = document.getElementById('url').value;

        if(!url) {
            alert("Greeting URL을 입력해주세요.");
            return;
        }

        let openingId = "O-ID";
        let applicantId = "A-ID";

        try {
            const urlObj = new URL(url);
            
            // 1. 포지션 번호 추출 (/opening/12345/)
            const pathParts = urlObj.pathname.split('/');
            const openingIndex = pathParts.indexOf('opening');
            if (openingIndex !== -1 && pathParts[openingIndex + 1]) {
                openingId = pathParts[openingIndex + 1];
            }

            // 2. 지원자 번호 추출 (?applicant=12345)
            applicantId = urlObj.searchParams.get('applicant') || "A-ID";
        } catch (e) {
            alert("올바른 URL 형식이 아닙니다.");
            return;
        }

        // 최종 출력 형식: [Tech][대면인터뷰] 1-2 Recruiter(164969) - 강한솔(6776271)
        const finalTitle = `[${t1}][${t2}] ${step} ${position}(${openingId}) - ${candidate}(${applicantId})`;
        
        const resultContainer = document.getElementById('resultContainer');
        const resultText = document.getElementById('resultText');
        
        resultText.innerText = finalTitle;
        resultContainer.style.display = 'block';
    }

    function copyToClipboard() {
        const text = document.getElementById('resultText').innerText;
        navigator.clipboard.writeText(text).then(() => {
            alert("복사되었습니다!");
        });
    }
</script>

</body>
</html>
